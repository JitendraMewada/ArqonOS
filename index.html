<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- ============================================== -->
    <!-- Advanced Metadata & Meta Tags                  -->
    <!-- ============================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>ArqonOS - The Operating System for the Built Environment</title>
    <meta name="description" content="ArqonOS is the overarching parent application and gateway for the Arqon ecosystem, connecting B2B workspaces, B2C Nest, and D2C shops with intelligent systems.">
    <meta name="keywords" content="ArqonOS, Arqon, Workspace, SaaS, Interior Design, Flow, Quest, Connect, B2B">
    <meta name="author" content="ArqonOS Pvt Ltd.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    
    <!-- SEO Canonicalization -->
    <link rel="canonical" href="https://arqonos.com/">
    
    <!-- ============================================== -->
    <!-- Advanced Security Meta Tags                    -->
    <!-- ============================================== -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Modern Permissions Policy -> Blocks unwanted browser API access -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()">

    <!-- ============================================== -->
    <!-- Advanced Social & Open Graph Tags              -->
    <!-- ============================================== -->
    <meta property="og:title" content="ArqonOS - The Operating System for the Built Environment">
    <meta property="og:description" content="ArqonOS is the overarching parent application and gateway for the Arqon ecosystem, connecting B2B workspaces, B2C Nest, and D2C shops with intelligent systems.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arqonos.com/">
    <meta property="og:image" content="https://picsum.photos/seed/arqonos_og/1200/630">
    <meta property="og:image:alt" content="ArqonOS Platform Interface">
    <meta property="og:site_name" content="ArqonOS">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@ArqonOS">
    <meta name="twitter:creator" content="@ArqonOS">
    <meta name="twitter:title" content="ArqonOS - The Operating System for the Built Environment">
    <meta name="twitter:description" content="ArqonOS is the overarching parent application and gateway for the Arqon ecosystem.">
    <meta name="twitter:image" content="https://picsum.photos/seed/arqonos_twitter/1200/630">
    <meta name="twitter:image:alt" content="ArqonOS Platform Interface">

    <!-- ============================================== -->
    <!-- Native App Deep Linking & Smart Banners        -->
    <!-- ============================================== -->
    <!-- iOS App Store Link (Prompts native app download if available) -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID_HERE, app-argument=https://arqonos.com/">
    <!-- Android Play Store Universal Link App-ID -->
    <meta name="google-play-app" content="app-id=com.arqonos.app">

    <!-- ============================================== -->
    <!-- Advanced Apple Ready & PWA Ready               -->
    <!-- ============================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ArqonOS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/favicon.svg">
    
    <!-- ============================================== -->
    <!-- Advanced Android & PWA Ready                   -->
    <!-- ============================================== -->
    <!-- Brand Colors for OS Level UI -->
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <!-- Universal fallback theme color -->
    <meta name="theme-color" content="#3b82f6">
    
    <!-- System Color Scheme Indication -->
    <meta name="color-scheme" content="dark light">
    
    <!-- Web App Capability & Naming -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="ArqonOS">
    
    <!-- PWA Manifest connection -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
    
    <!-- Disable Automatic Format Detection (Prevents Safari/Chrome from turning numbers into links) -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    
    <!-- Legacy Mobile Compatibility -->
    <meta name="HandheldFriendly" content="true">

    <!-- ============================================== -->
    <!-- Advanced Icons                                 -->
    <!-- ============================================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#3b82f6">

    <!-- ============================================== -->
    <!-- Advanced Fonts & Resource Hints                -->
    <!-- ============================================== -->
    <!-- Preconnect / DNS-prefetch critical domains -->
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load Core Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    
    <!-- ============================================== -->
    <!-- Advanced AI Ready (Structured Data / JSON-LD)  -->
    <!-- ============================================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ArqonOS",
      "url": "https://arqonos.com/",
      "description": "The Operating System for the Built Environment. Connecting B2B workspaces, B2C Nest, and D2C shops with intelligent systems.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://arqonos.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "ArqonOS Pvt Ltd.",
        "logo": {
          "@type": "ImageObject",
          "url": "https://arqonos.com/favicon.svg"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ArqonOS Shell",
      "operatingSystem": "All",
      "applicationCategory": "WebApplication",
      "offers": {
        "@type": "Offer",
        "price": "699",
        "priceCurrency": "INR"
      }
    }
    </script>

    <!-- Fallback Core Styling until React/Tailwind loads -->
    <style>
        :root {
            --bg-color: #000000; /* High-contrast pure black background for Arqon */
            --text-color: #ffffff;
            --accent-color: #3b82f6; /* ArqonOS Google Blue */
            --font-main: 'Inter', sans-serif;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --text-color: #121212;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .app-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            font-size: 1.25rem;
            color: var(--accent-color);
        }
        .app-loader.fade-out {
            opacity: 0;
            transition: opacity 0.8s ease-out;
            pointer-events: none;
        }
        noscript {
            display: block;
            background: #ef4444;
            color: white;
            text-align: center;
            padding: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <noscript>
        You need to enable JavaScript to run ArqonOS.
    </noscript>

    <!-- React App Mounting Point -->
    <div id="root">
        <div class="app-loader">
            <svg viewBox="0 0 100 100" style="width: 64px; height: 64px;">
                <rect x="15" y="15" width="32" height="32" rx="6" fill="#3b82f6" />
                <rect x="53" y="15" width="32" height="32" rx="6" fill="#3b82f6" fill-opacity="0.85" />
                <rect x="15" y="53" width="32" height="32" rx="6" fill="#3b82f6" fill-opacity="0.7" />
                <rect x="53" y="53" width="32" height="32" rx="6" fill="#3b82f6" fill-opacity="0.5" />
            </svg>
        </div>
    </div>
    
    <!-- React/Vite Script Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ============================================== -->
    <!-- Advanced Services & Registration (PWA)         -->
    <!-- ============================================== -->
    <script>
        // Advance Service Worker Registration for PWA functionality
        // We delay this slightly to prioritize main app hydration on mobile
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    navigator.serviceWorker.register('/sw.js')
                        .then(registration => {
                            console.log('ArqonOS ServiceWorker registration successful');
                        })
                        .catch(err => {
                            console.warn('ArqonOS ServiceWorker registration failed: ', err);
                        });
                }, 2000);
            });
        }

        // Failsafe to remove loader if React fails to mount or hangs
        setTimeout(() => {
            const loader = document.querySelector('.app-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
            }
        }, 8000);
    </script>
</body>
</html>
